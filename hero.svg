<text x="56" y="88" font-size="15" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">README.md</text>
<text x="56" y="152" font-size="54" font-weight="700" fill="#e6edf3">Hi, I'm <tspan fill="url(#name)">Madhur</tspan></text>
<text x="56" y="196" font-size="22" font-weight="600" fill="#e6edf3">AI/ML Engineering <tspan fill="#9aa7b4">•</tspan> Application Security</text>
<text x="56" y="236" font-size="17" fill="#9aa7b4">I build LLM-powered systems and security tooling: fine-tuned</text>
<text x="56" y="260" font-size="17" fill="#9aa7b4">models, agentic pipelines over MCP, and the backends behind them.</text>
